version: 2

updates:
  # Python dependencies. The `uv` ecosystem updates uv.lock alongside
  # pyproject.toml; `pip` would bump the manifest and leave the lock stale.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      # Test and lint tooling moves often and rarely needs thought; batching it
      # keeps the queue readable. Runtime dependencies are deliberately left
      # ungrouped so each arrives as its own pull request - `mcp` 2.0.0 removed
      # the module this server was built on, and a change of that kind has to be
      # read rather than merged with a batch.
      dev-tooling:
        patterns:
          - "pytest*"
          - "ruff"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      # Digest rebuilds are the security-patch path and should arrive quickly.
      # The docker ecosystem accepts only `default-days` - the `semver-*-days`
      # keys are rejected for it, and Dependabot fails the whole file rather
      # than the one key, which silences every ecosystem here.
      #
      # So a Python version move gets the same 7 days as a digest rebuild
      # rather than a longer settle. That is the right way round to lose it:
      # Python ships one of these a year, and that annual pull request is what
      # stops the pinned release reaching its end-of-life with nothing saying
      # so. Do not "ignore" it to reduce noise.
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
