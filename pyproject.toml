[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monzo-mcp"
version = "0.2.0"
description = "MCP server for the Monzo banking API with OAuth, local transaction cache, and spending analysis."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
keywords = ["monzo", "mcp", "model-context-protocol", "banking", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.6",
]

[project.scripts]
monzo-mcp = "main:main"

[project.urls]
Repository = "https://github.com/partymola/monzo-mcp"
Issues = "https://github.com/partymola/monzo-mcp/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/main.py" = ["E402"]
