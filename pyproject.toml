[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monzo-mcp"
version = "0.5.1"
description = "MCP server for the Monzo banking API with OAuth, local transaction cache, and spending analysis."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
keywords = ["monzo", "mcp", "model-context-protocol", "banking", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
]
# Every dependency is pinned to an exact version that the suite has been run
# against. A range leaves the choice to the resolver, which is how `mcp` 2.0.0
# reached installs unannounced and broke them. Bump deliberately, never by
# widening a spec.
dependencies = [
    "mcp==2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.1",
]

[project.scripts]
monzo-mcp = "main:main"

[project.urls]
Repository = "https://github.com/partymola/monzo-mcp"
Issues = "https://github.com/partymola/monzo-mcp/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/main.py" = ["E402"]
