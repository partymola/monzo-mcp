[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monzo-mcp"
version = "0.4.0"
description = "MCP server for the Monzo banking API with OAuth, local transaction cache, and spending analysis."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
keywords = ["monzo", "mcp", "model-context-protocol", "banking", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    # Capped below 2.0: the server is built on `mcp.server.fastmcp`, which 2.0.0
    # no longer ships. Lifting the cap means porting to its replacement first.
    "mcp>=1.6.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    # Pinned exactly so local and CI lint are deterministic: ruff's formatter
    # changes between releases, and an unpinned spec lets CI pull a newer ruff
    # that reformats code an older local ruff had passed. Bump deliberately.
    "ruff==0.15.20",
]

[project.scripts]
monzo-mcp = "main:main"

[project.urls]
Repository = "https://github.com/partymola/monzo-mcp"
Issues = "https://github.com/partymola/monzo-mcp/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/main.py" = ["E402"]
